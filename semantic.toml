# Semantic Core Configuration
# Generated by: semantic init

# === Default Providers (Phase 15.4) ===
# Выберите провайдеров по умолчанию для каждого компонента
[defaults]
embedding_provider = "local"        # gemini | local | openai  ← ЛОКАЛЬНЫЕ (Qwen3)
llm_provider = "gemini"             # gemini | openai | ollama
transcription_provider = "gemini"   # gemini | whisper
vision_provider = "gemini"          # gemini  ← ОБЛАЧНЫЙ (Flash 2.5)

[database]
path = "semantic.db"

[logging]
level = "INFO"
# file = "semantic.log"  # Раскомментируйте для записи в файл

# === Google Gemini Provider (Phase 15.4) ===
[providers.gemini]
# API ключ: раскомментируй и вставь свой ключ, ИЛИ установи переменную GEMINI_API_KEY
# api_key = "AIza..."
# batch_key = "AIza..."  # Отдельный ключ для Batch API (опционально)
embedding_model = "models/gemini-embedding-001"
llm_model = "models/gemini-2.0-flash"
dimension = 768
max_tokens = 2048

# === OpenAI Provider (Phase 15.4) ===
# Используется для embeddings и LLM (GPT-4o, GPT-4o-mini)
# [providers.openai]
# api_key = "${OPENAI_API_KEY}"  # Читаем из env
# base_url = "https://api.openai.com/v1"
# embedding_model = "text-embedding-3-small"
# llm_model = "gpt-4o-mini"
# dimension = 1536
# max_tokens = 8191

# === Local Models Provider (Phase 15.4) ===
# Локальные модели через MLX (Apple Silicon) или PyTorch
[providers.local]
embedding_model = "qwen3-embedding"  # all-minilm | qwen3-embedding | bge-small  ← QWEN3!
whisper_model = "base"               # tiny | base | small | medium | large
device = "auto"                      # auto | mlx | cuda | mps | cpu

# === Ollama Provider (Phase 15.4) ===
# Локальный LLM сервер (llama3.3, mistral, и др.)
# [providers.ollama]
# base_url = "http://localhost:11434/v1"
# llm_model = "llama3.3:70b"

# === Legacy Gemini Config (deprecated, но обратно совместимо) ===
[gemini]
# API ключ: раскомментируй и вставь свой ключ, ИЛИ установи переменную GEMINI_API_KEY
# api_key = "AIza..."
model = "models/gemini-embedding-001"
embedding_dimension = 768

[processing]
splitter = "smart"           # simple | smart
context_strategy = "hierarchical"  # basic | hierarchical
chunk_size = 1800            # Размер текстового чанка (500-8000 символов)
code_chunk_size = 2000       # Размер чанка кода (500-10000 символов)

[media]
enabled = true
rpm_limit = 15  # Запросов в минуту для Vision/Audio API
max_output_tokens = 65536  # Лимит токенов для Gemini (image/audio/video), макс 65536
output_language = "Russian"  # Язык ответов анализаторов (Russian/English/French/etc)

# === Media Chunk Sizes (Phase 14.3) ===
# Разные размеры чанков для разных типов медиа-контента
[media.chunk_sizes]
summary_chunk_size = 1500          # Размер чанка для summary/description
transcript_chunk_size = 2000       # Размер чанка для транскрипции аудио/видео
ocr_text_chunk_size = 1800         # Размер чанка для обычного OCR текста
ocr_code_chunk_size = 2000         # Размер чанка для code blocks из OCR (больше, т.к. код плотнее)

# === Media Processing (Phase 14.3) ===
[media.processing]
ocr_parser_mode = "markdown"       # markdown | plain — детекция code blocks в OCR
enable_timecodes = true            # Извлекать таймкоды из транскрипции
strict_timecode_ordering = false   # Требовать строгого порядка таймкодов
max_timeline_items = 100           # Лимит элементов timeline (10-500)

# === Custom Prompts (Phase 14.3) ===
# Кастомизация промптов для анализа медиа
# [media.prompts]
# audio_instructions = "Focus on technical terms and speaker names"
# video_instructions = "Describe on-screen code snippets in detail"
# image_instructions = "Extract all visible text, especially code"

[search]
limit = 10      # Результатов по умолчанию
type = "hybrid"  # vector | fts | hybrid
